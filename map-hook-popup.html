<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예비 창업자 배너</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: #191f28;
    }

    .map-preview-hook {
      width: 292px;
      max-width: 100%;
      padding: 18px 18px 16px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14), 0 0 0 1px rgba(255, 64, 108, 0.12);
      line-height: 1.45;
      text-align: left;
    }

    .map-preview-hook-badge {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff0f3;
      color: #ff406c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .map-preview-hook-eyebrow {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #8b95a1;
    }

    .map-preview-hook-title {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.03em;
    }

    .map-preview-hook-desc {
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.5;
      color: #8b95a1;
    }

    .map-preview-hook-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      border-radius: 10px;
      background: #ff406c;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .map-preview-hook-btn:hover {
      background: #e0355c;
    }
  </style>
</head>
<body>
  <aside class="map-preview-hook" aria-label="예비 창업자 안내">
    <span class="map-preview-hook-badge">예비 창업자</span>
    <p class="map-preview-hook-eyebrow">2026년 창업 준비 중이신가요?</p>
    <h1 class="map-preview-hook-title">창업 전, 이 동네 손님부터<br>확인해 보세요</h1>
    <p class="map-preview-hook-desc">실수요자가 모이는 상권·매물만 모아, 첫 매장 후보를 빠르게 좁혀 드려요.</p>
    <a href="https://your-link-here" class="map-preview-hook-btn">무료 상담 받기</a>
  </aside>
</body>
</html>
