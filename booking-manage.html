<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계약 진행 — 네모 광고</title>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body class="manage-page">

  <div class="manage-shell">

    <aside class="manage-sidebar">
      <a href="account.html" class="manage-logo">
        <img src="assets/nemo_logo_logo.png" alt="네모" width="28" height="28">
        <span>네모 애즈 (광고주 센터)</span>
      </a>
      <nav class="manage-nav">
        <a href="ad-accounts.html" class="manage-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          광고주 계정 관리
        </a>
        <a href="booking-manage.html" class="manage-nav-item manage-nav-item--sub is-active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          계약 진행
        </a>
        <a href="contract-manage.html" class="manage-nav-item manage-nav-item--sub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/>
          </svg>
          광고 제안서 자료실
        </a>
        <a href="campaign-manage.html" class="manage-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          캠페인 관리
        </a>
        <a href="settlement-manage.html" class="manage-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          정산 관리
        </a>
        <a href="report.html" class="manage-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
          </svg>
          성과 보고서
        </a>
      </nav>
    </aside>

    <main class="manage-main">

      <div class="manage-topbar">
        <div class="manage-topbar-title">
          <h1>계약 진행</h1>
          <p class="manage-topbar-desc">캠페인 생성 전 · 문의 접수 → 계약·품의 → 부킹 완료</p>
        </div>
        <div class="manage-topbar-actions">
          <button class="btn btn-primary" id="newBookingBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            건 추가
          </button>
        </div>
      </div>

      <section class="booking-panel booking-panel--page" id="bookingPanel">
        <div class="booking-toolbar">
          <div class="booking-status-tabs" id="bookingStatusTabs">
            <button type="button" class="booking-status-tab is-active" data-status="">전체 <span class="booking-tab-count" id="bookingCountAll">0</span></button>
            <button type="button" class="booking-status-tab" data-status="lead_received">문의 접수 <span class="booking-tab-count" id="bookingCountLead">0</span></button>
            <button type="button" class="booking-status-tab" data-status="contract_progress">계약·품의 진행중 <span class="booking-tab-count" id="bookingCountContract">0</span></button>
            <button type="button" class="booking-status-tab" data-status="booking_ready">부킹 완료 <span class="booking-tab-count" id="bookingCountReady">0</span></button>
          </div>
          <div class="booking-shortcut-links">
            <a href="https://flex.team/workflow/archive/my?workflow-action=view&workflow-task-key=6e70c52352c94d70a1627c556efcb67c" class="booking-shortcut-btn" id="bookingApprovalLink" target="_blank" rel="noopener noreferrer">품의서 작성 바로가기</a>
            <a href="https://docs.google.com/document/d/1i7NZWovaLRbhyiqLCWF3qvrQ-z_7LXoq/edit" class="booking-shortcut-btn" id="bookingPublishLink" target="_blank" rel="noopener noreferrer">게재 신청서 바로가기</a>
          </div>
        </div>

        <div class="manage-table-wrap booking-table-wrap">
          <table class="manage-table booking-table">
            <thead>
              <tr>
                <th>광고주/회사</th>
                <th>희망 예산</th>
                <th>집행 일정</th>
                <th>캠페인 목적</th>
                <th>연락 가능한 이메일</th>
                <th>유선 문의 가능 시간</th>
                <th>소재 갯수</th>
                <th>상태</th>
                <th>다음 단계</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="bookingTbody"></tbody>
          </table>
          <div class="manage-empty booking-empty" id="bookingEmpty" style="display:none">
            <p>등록된 계약 진행 건이 없습니다.</p>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div class="manage-modal-overlay" id="bookingModalOverlay" style="display:none">
    <div class="manage-modal manage-modal--md" role="dialog" aria-modal="true">
      <div class="manage-modal-header">
        <h2 id="bookingModalTitle">계약 진행 건 추가</h2>
        <button class="manage-modal-close" id="bookingModalCloseBtn" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="manage-modal-body" style="padding:20px">
        <div class="booking-inquiry-detail" id="bkInquiryDetail" hidden>
          <h3 class="booking-inquiry-detail-title">문의 접수 내용</h3>
          <dl class="booking-inquiry-dl" id="bkInquiryDl"></dl>
        </div>
        <form id="bookingForm" novalidate>
          <div class="report-form-grid">
            <div class="report-form-field" style="grid-column:1/-1">
              <label for="bkCompany">광고주/회사명 <span class="manage-required">*</span></label>
              <input type="text" id="bkCompany" placeholder="예: OO상가" maxlength="60" required>
              <p class="manage-field-error" data-error="bkCompany"></p>
            </div>
            <div class="report-form-field">
              <label for="bkEmail">연락 이메일</label>
              <input type="email" id="bkEmail" placeholder="contact@company.com">
            </div>
            <div class="report-form-field">
              <label for="bkStatus">상태</label>
              <select id="bkStatus">
                <option value="lead_received">문의 접수</option>
                <option value="contract_progress">계약·품의 진행중</option>
                <option value="booking_ready">부킹 완료 · 캠페인 생성 필요</option>
              </select>
            </div>
            <div class="report-form-field" style="grid-column:1/-1">
              <label for="bkAccountId">연결 광고 계정</label>
              <select id="bkAccountId">
                <option value="">— 선택 (나중에 연결 가능) —</option>
              </select>
            </div>
            <div class="report-form-field" style="grid-column:1/-1">
              <label for="bkMemo">메모</label>
              <input type="text" id="bkMemo" placeholder="견적·품의 참고 사항">
            </div>
          </div>
        </form>
      </div>
      <div class="manage-modal-footer">
        <button class="btn btn-outline" id="bookingModalCancelBtn" type="button">취소</button>
        <button class="btn btn-primary" id="bookingModalSaveBtn" type="button">저장</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js?v=3"></script>
  <script>requireAuth('manager');</script>
  <script src="inquiry-booking.js?v=2"></script>
  <script src="booking-manage.js?v=1"></script>
</body>
</html>
